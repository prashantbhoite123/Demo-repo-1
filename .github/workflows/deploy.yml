name: Next.js CI/CD Pipeline

on:
  push:
    branches: 
      - feature/ec2-cicd-setup
      
env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # Job 1: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            frontend/.next/
            frontend/public/
          retention-days: 1

  # Job 2: Docker Build and Push
  docker-build:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/ec2-cicd-setup' || github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 3: Deploy to Vercel
  deploy-to-vercel:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: production 
    if: github.ref == 'refs/heads/feature/ec2-cicd-setup'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

  # Job 4: Deploy to EC2 (Optional - uncomment and configure as needed)
  # deploy-to-ec2:
  #   needs: docker-build
  #   runs-on: ubuntu-latest
  #   if: github.ref == 'refs/heads/feature/ec2-cicd-setup'
  #   
  #   steps:
  #     - name: Deploy to EC2
  #       uses: appleboy/ssh-action@v1.0.0
  #       with:
  #         host: ${{ secrets.EC2_HOST }}
  #         username: ${{ secrets.EC2_USERNAME }}
  #         key: ${{ secrets.EC2_PRIVATE_KEY }}
  #         port: ${{ secrets.EC2_PORT || 22 }}
  #         script: |
  #           # Pull the latest image
  #           docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:feature-ec2-cicd-setup-${{ github.sha }}
  #           
  #           # Stop and remove existing container
  #           docker stop nextjs-app || true
  #           docker rm nextjs-app || true
  #           
  #           # Run new container
  #           docker run -d \
  #             --name nextjs-app \
  #             -p 3000:3000 \
  #             -e NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
  #             ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:feature-ec2-cicd-setup-${{ github.sha }}
  #           
  #           # Clean up old images
  #           docker image prune -f

  # Job 5: Notification (Optional)
  notify:
    needs: [build-and-test, docker-build, deploy-to-vercel]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.build-and-test.result }}" == "success" ] && [ "${{ needs.deploy-to-vercel.result }}" == "success" ]; then
            echo "✅ Vercel deployment successful for branch: ${{ github.ref_name }}"
            echo "🚀 Your Next.js app is now live on Vercel!"
          else
            echo "❌ Deployment failed for branch: ${{ github.ref_name }}"
            echo "Build status: ${{ needs.build-and-test.result }}"
            echo "Vercel deployment status: ${{ needs.deploy-to-vercel.result }}"
          fi